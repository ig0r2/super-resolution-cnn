defaults:
  mode: psnr
  multiscale: true
  jpeg_degradation: false

  training:
    patch_size: 96
    batch_size: 16
    epochs: 1200
    lr: 0.0001
    scheduler_milestones: [ 500, 1000 ]
    validate_every: 50

  data:
    num_workers: 2
    train_preload: True
    val_preload: True

models:
  - name: SR_EDSR_Multi
    checkpoint_name: SR_EDSR_2_52
    params:
      num_blocks: 2
      nf: 52
  - name: SR_EDSR_Multi
    checkpoint_name: SR_EDSR_4_52
    params:
      num_blocks: 4
      nf: 52

